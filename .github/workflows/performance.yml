name: ParaBank performance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Simulation to run
        type: choice
        required: true
        default: login
        options: [login, transfer, statement, loan, billpay, all]
      profile:
        description: Load profile
        type: choice
        required: true
        default: normal
        options: [normal, peak, stress]

permissions:
  contents: read

concurrency:
  group: parabank-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp test-compile
      - run: python3 -m py_compile scripts/reconcile-transactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.run_id }}
          path: target
          if-no-files-found: ignore
          retention-days: 14

  load:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, parabank-perf]
    timeout-minutes: 90
    environment: parabank-isolated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify isolated target
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
        run: python3 scripts/validate-target.py
      - name: Configure test data
        env:
          USERS_CSV: ${{ secrets.USERS_CSV }}
          TRANSFERS_CSV: ${{ secrets.TRANSFERS_CSV }}
          STATEMENTS_CSV: ${{ secrets.STATEMENTS_CSV }}
          LOANS_CSV: ${{ secrets.LOANS_CSV }}
          PAYMENTS_CSV: ${{ secrets.PAYMENTS_CSV }}
        run: scripts/install-test-data.sh
      - name: Run selected Gatling simulation(s)
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          PROFILE: ${{ inputs.profile }}
          DURATION_SECONDS: '300'
          RAMP_SECONDS: '60'
          DATA_DIR: data
        shell: bash
        run: |
          case "${{ inputs.scenario }}" in
            login) classes=(LoginSimulation) ;;
            transfer) classes=(TransferSimulation) ;;
            statement) classes=(StatementSimulation) ;;
            loan) classes=(LoanSimulation) ;;
            billpay) classes=(BillPaySimulation) ;;
            all) classes=(LoginSimulation TransferSimulation StatementSimulation LoanSimulation BillPaySimulation) ;;
            *) echo "Unsupported scenario" >&2; exit 2 ;;
          esac
          for class in "${classes[@]}"; do
            export ATTEMPTS_FILE="evidence/runs/attempts-${class}.csv"
            ./mvnw -B -ntp gatling:test "-Dgatling.simulationClass=com.parabank.perf.simulations.${class}"
          done
      - name: Evaluate transfer throughput window
        if: always() && (inputs.scenario == 'transfer' || inputs.scenario == 'all')
        run: |
          attempts="evidence/runs/attempts-TransferSimulation.csv"
          if [ -s "$attempts" ]; then
            python3 scripts/evaluate-transfer-throughput.py "$attempts" | tee evidence/runs/transfer-throughput.json
          else
            echo "Transfer attempts were not recorded; result remains inconclusive." >&2
            exit 2
          fi
      - name: Save run metadata
        if: always()
        env:
          SCENARIO: ${{ inputs.scenario }}
          PROFILE: ${{ inputs.profile }}
        run: python3 scripts/write-run-metadata.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatling-${{ inputs.scenario }}-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            target/gatling
            evidence/runs
          if-no-files-found: warn
          retention-days: 30
