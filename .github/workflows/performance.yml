name: ParaBank performance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Simulation to run
        type: choice
        required: true
        default: all
        options: [login, transfer, statement, loan, billpay, all]
      profile:
        description: Load profile
        type: choice
        required: true
        default: smoke
        options: [smoke, normal, peak, stress]

permissions:
  contents: read

concurrency:
  group: parabank-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start isolated ParaBank binary
        run: scripts/parabank-up.sh
      - name: Initialize demo database and performance data
        run: |
          scripts/reset-local-parabank-db.sh
          scripts/prepare-parabank-local-data.py
      - name: Refuse any target outside the isolated instance
        env:
          BASE_URL: http://127.0.0.1:8080/parabank/services/bank
          ALLOWED_HOSTS: 127.0.0.1
        run: python3 scripts/validate-target.py
      - name: Compile Gatling simulations
        run: ./mvnw -B -ntp test-compile
      - name: Run selected Gatling simulations
        env:
          BASE_URL: http://127.0.0.1:8080/parabank/services/bank
          ALLOWED_HOSTS: 127.0.0.1
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}
          DURATION_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.profile != 'smoke' && '300' || '10' }}
          RAMP_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.profile != 'smoke' && '60' || '10' }}
          USERS: '2'
          RATE_PER_SECOND: '5'
          DATA_DIR: data
          SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'all' }}
        shell: bash
        run: |
          case "$SCENARIO" in
            login) classes=(LoginSimulation) ;;
            transfer) classes=(TransferSimulation) ;;
            statement) classes=(StatementSimulation) ;;
            loan) classes=(LoanSimulation) ;;
            billpay) classes=(BillPaySimulation) ;;
            all) classes=(LoginSimulation TransferSimulation StatementSimulation LoanSimulation BillPaySimulation) ;;
            *) echo "Unsupported scenario" >&2; exit 2 ;;
          esac
          status=0
          for class in "${classes[@]}"; do
            echo "############ ${class} with PROFILE=${PROFILE}"
            scripts/run-scenario.sh "${class}" "${PROFILE}" || status=$?
          done
          exit "${status}"
      - name: Build acceptance summary
        if: always()
        run: python3 scripts/build-summary.py evidence/runs || true
      - name: Save run metadata
        if: always()
        env:
          SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'all' }}
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}
          BASE_URL: http://127.0.0.1:8080/parabank/services/bank
        run: python3 scripts/write-run-metadata.py
      - name: Capture ParaBank logs
        if: always()
        run: docker compose -f compose.yaml logs --no-color --tail=300 parabank > evidence/runs/parabank-container.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gatling-${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'all' }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}-${{ github.run_id }}
          path: |
            target/gatling
            evidence/runs
          if-no-files-found: warn
          retention-days: 30
      - name: Stop ParaBank
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
