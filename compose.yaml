name: parabank-perf
services:
  parabank:
    image: parasoft/parabank@sha256:8c08664c7b4be5dc3b1dcf5bbc75f57bbcc1b363ea063fae873409a0883a8e44
    container_name: parabank-perf-under-test
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${PARABANK_PORT:-8080}:8080"
    networks:
      - parabank-isolated

networks:
  parabank-isolated:
    name: parabank-perf-isolated
